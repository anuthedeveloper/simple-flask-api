{% extends "auth_layout.html" %}

{% block title %}Create account · Simple Flask API{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <section class="auth-card">
      <div class="auth-card-header text-center">
        <h1 class="title">Create account</h1>
        <p class="auth-subtitle">A few details to get started</p>
      </div>
      <div class="auth-card-body p-4">
        {% if msg %}
        <div class="alert alert-info" role="status">{{ msg }}</div>
        {% endif %}
        <form action="{{ url_for('register') }}" method="post" autocomplete="on">
          <div class="form-group text-left">
            <label for="name">Full name</label>
            <input
              class="form-control"
              type="text"
              name="name"
              id="name"
              placeholder="John Doe"
              minlength="3"
              maxlength="50"
              autocomplete="name"
              required
            />
          </div>
          <div class="form-group text-left">
            <label for="username">Username</label>
            <input
              class="form-control"
              type="text"
              name="username"
              id="username"
              placeholder="johndoe"
              minlength="3"
              maxlength="20"
              pattern="[A-Za-z0-9_]+"
              autocomplete="username"
              required
            />
          </div>
          <div class="form-group text-left">
            <label for="email">Email</label>
            <input
              class="form-control"
              type="email"
              name="email"
              id="email"
              placeholder="john.doe@example.com"
              maxlength="30"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-group text-left">
            <label for="password">Password</label>
            <input
              class="form-control"
              type="password"
              name="password"
              id="password"
              placeholder="••••••••"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </div>
          <div class="form-group text-left">
            <label for="gender">Gender</label>
            <select class="form-control" name="gender" id="gender" required>
              <option value="">Select an option</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-round btn-lg btn-block">
            Create account
          </button>
        </form>
      </div>
      <div class="auth-card-footer text-center py-4">
        <p class="auth-footer">
          Already registered? <a href="{{ url_for('login') }}">Log in</a>
        </p>
      </div>
    </section>
  </div>
</div>
{% endblock %}
